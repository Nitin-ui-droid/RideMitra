<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Ride - RideMitra</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --ink:#111827;
  --muted:#718096;
  --line:#e8edf4;
  --nav:#111827;
  --nav2:#172133;
  --orange:#ff5a1f;
  --orange2:#f0440d;
  --shadow:0 20px 60px rgba(15,23,42,.09);
  --sidebar:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--ink);overflow-x:hidden;
}
button,input{font:inherit}

/* SIDEBAR */
.side-nav{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);min-height:100vh;
  background:linear-gradient(180deg,#0b1220 0%,#111827 55%,#172133 100%);
  padding:25px 15px;z-index:1000;color:#fff;
  display:flex;flex-direction:column;
  box-shadow:12px 0 40px rgba(15,23,42,.08);
}
.side-nav::after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  right:-150px;bottom:-80px;background:rgba(255,90,31,.08);filter:blur(8px);pointer-events:none;
}
.side-logo{
  display:flex;align-items:center;gap:11px;padding:8px 10px 27px;
  position:relative;z-index:1;font-size:21px;letter-spacing:-.8px;
}
.logo-icon{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--orange),#ff7b4a);
  box-shadow:0 10px 25px rgba(255,90,31,.28);font-size:17px;
}
.side-logo span{color:var(--orange)}
.side-nav-links{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.side-nav-links a{
  height:50px;padding:0 14px;border-radius:13px;color:#9eabbc;text-decoration:none;
  display:flex;align-items:center;gap:14px;font-size:13px;font-weight:700;transition:.2s ease;
}
.side-nav-links a i{width:18px;text-align:center;font-size:15px}
.side-nav-links a:hover{background:rgba(255,255,255,.055);color:#fff}
.side-nav-links a.active{
  background:linear-gradient(135deg,rgba(255,90,31,.18),rgba(255,90,31,.08));
  color:#fff;border:1px solid rgba(255,90,31,.18);
}
.side-nav-links a.active i{color:var(--orange)}

.menu-toggle{
  display:none;position:fixed;top:16px;left:16px;width:46px;height:46px;border:0;
  border-radius:14px;background:#111827;color:var(--orange);z-index:1200;
  cursor:pointer;font-size:18px;box-shadow:0 10px 30px rgba(15,23,42,.2);
}

/* MAIN */
.main-layout{margin-left:var(--sidebar);min-height:100vh}
.top-bar{
  height:78px;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 46px;position:sticky;top:0;z-index:100;
}
.top-bar h2{font-size:19px;letter-spacing:-.6px}
.top-bar-right{display:flex;align-items:center;gap:10px}
.btn{
  border:0;border-radius:12px;height:44px;padding:0 17px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;
  font-size:12px;font-weight:800;transition:.2s ease;
}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 10px 22px rgba(255,90,31,.22)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(255,90,31,.28)}
.btn.secondary{color:#374151;background:#fff;border:1px solid var(--line)}
main{padding:38px 46px 60px;max-width:1600px;margin:auto}

/* HERO */
.hero{
  position:relative;overflow:hidden;padding:48px 48px 42px;border-radius:28px;
  background:linear-gradient(135deg,#101827 0%,#172234 58%,#1c2a3d 100%);
  box-shadow:var(--shadow);color:#fff;
}
.hero::before{
  content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-120px;top:-210px;
  border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 55px rgba(255,255,255,.018),0 0 0 110px rgba(255,255,255,.012);
}
.hero::after{
  content:"";position:absolute;width:250px;height:250px;border-radius:50%;left:-100px;bottom:-170px;
  background:rgba(255,90,31,.13);filter:blur(12px);
}
.hero h1,.hero p,.search-box{position:relative;z-index:1}
.hero h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.8px;line-height:1.1;margin-bottom:12px}
.hero p{color:#aeb8c7;font-size:13px;line-height:1.7;max-width:580px}
.search-box{
  margin-top:32px;background:#fff;border:1px solid rgba(255,255,255,.12);border-radius:18px;
  padding:10px;display:grid;grid-template-columns:1.15fr 1.15fr .9fr auto;gap:8px;
  box-shadow:0 16px 45px rgba(0,0,0,.18);
}
.input-group{min-width:0;padding:9px 13px;border-radius:12px;transition:.2s;background:#f8fafc;border:1px solid transparent}
.input-group:focus-within{background:#fff;border-color:rgba(255,90,31,.35);box-shadow:0 0 0 3px rgba(255,90,31,.07)}
.input-group label{display:flex;align-items:center;gap:7px;color:#64748b;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.input-group label i{color:var(--orange)}
.input-group input{width:100%;border:0;outline:0;background:transparent;color:#111827;font-size:12px;font-weight:700;padding:2px 0}
.input-group input::placeholder{color:#a4afbd;font-weight:500}
.search-box .btn{height:auto;min-width:132px;border-radius:12px}

/* RIDES */
.rides-section{margin-top:36px}
.rides-section>h2{font-size:23px;letter-spacing:-.8px;margin-bottom:20px}
#publishedRide{min-height:150px}
#publishedRide:empty{
  border:1px dashed #d8e0eb;border-radius:22px;background:rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;
}
#publishedRide:empty::before{
  content:"Rides matching your route will appear here";
  color:#94a3b8;font-size:12px;font-weight:700;
}

/* Dynamic cards created by script.js */
.ride-card,.published-ride-card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;
  box-shadow:0 10px 30px rgba(15,23,42,.045);margin-bottom:14px;
}

/* MODAL */
.ride-modal{
  position:fixed!important;inset:0;z-index:3000;background:rgba(10,16,28,.58);
  backdrop-filter:blur(5px);padding:20px;align-items:center;justify-content:center;
}
.ride-modal[style*="display: block"]{display:flex!important}
.ride-modal-content{
  width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;
  padding:30px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.25);
}
.ride-modal-content h2{font-size:22px;margin-bottom:20px;letter-spacing:-.6px}
.ride-modal-content h2 i{color:var(--orange);margin-right:7px}
.ride-modal-close{
  position:absolute;right:16px;top:15px;width:36px;height:36px;border:0;border-radius:10px;
  background:#f1f5f9;color:#475569;font-size:25px;line-height:1;cursor:pointer;
}
#joinRideModalButton{width:100%;margin-top:20px}

@media(max-width:1050px){
  :root{--sidebar:230px}
  main{padding:30px}
  .top-bar{padding:0 30px}
  .hero{padding:38px}
  .search-box{grid-template-columns:1fr 1fr}
  .search-box .btn{height:54px;grid-column:1/-1}
}
@media(max-width:760px){
  :root{--sidebar:270px}
  .side-nav{transform:translateX(-105%);transition:transform .28s ease}
  .side-nav.open{transform:translateX(0)}
  .main-layout{margin-left:0}
  .menu-toggle{display:grid;place-items:center}
  .top-bar{height:72px;padding:0 18px 0 76px}
  .top-bar h2{font-size:17px}
  main{padding:22px 15px 45px}
  .hero{padding:32px 20px;border-radius:22px}
  .hero h1{font-size:31px;letter-spacing:-1.2px}
  .hero p{font-size:12px}
  .search-box{grid-template-columns:1fr;padding:9px;margin-top:25px}
  .search-box .btn{grid-column:auto;height:50px}
  .input-group{min-height:62px}
  .rides-section{margin-top:28px}
}
@media(max-width:430px){
  .top-bar-right .btn{width:42px;padding:0}
  .top-bar-right .btn:not(i){font-size:0}
  .top-bar-right .btn i{font-size:14px}
}
</style>
</head>

<body class="theme-independence find-ride-page">

<button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-controls="sideNav" aria-expanded="false">
    <i class="fa-solid fa-bars"></i>
</button>

<nav class="side-nav" id="sideNav">
    <div class="side-logo">
        <i class="fa-solid fa-car-side logo-icon"></i>
        <strong>Ride<span>Mitra</span></strong>
    </div>

    <div class="side-nav-links">
        <a href="index.html">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </a>
        <a href="find-ride.html" class="active">
            <i class="fa-solid fa-magnifying-glass"></i><span>Find Ride</span>
        </a>
        <a href="offer-ride.html">
            <i class="fa-solid fa-circle-plus"></i><span>Offer Ride</span>
        </a>
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-pie"></i><span>Dashboard</span>
        </a>
        <a href="account.html"><i class="fa-solid fa-user"></i><span>Profile & Account</span></a>

    </div>
</nav>

<div class="main-layout">
<header class="top-bar">
    <div class="top-bar-left"><h2>Find a Ride</h2></div>
    <div class="top-bar-right" id="userArea">
        <a href="login.html" class="btn secondary">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>
    </div>
</header>

<main>
<section class="hero">
    <h1>Find Your Perfect Ride</h1>
    <p>Search for verified drivers travelling on your route and discover a smarter way to travel together.</p>

    <div class="search-box">
        <div class="input-group">
            <label for="fromLocation"><i class="fa-solid fa-location-dot"></i><span>From</span></label>
            <input type="text" id="fromLocation" name="fromLocation" placeholder="Enter starting location" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="toLocation"><i class="fa-solid fa-location-crosshairs"></i><span>To</span></label>
            <input type="text" id="toLocation" name="toLocation" placeholder="Enter destination" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="travelDate"><i class="fa-solid fa-calendar-days"></i><span>Date</span></label>
            <input type="date" id="travelDate" name="travelDate">
        </div>

        <button type="button" class="btn primary" id="searchButton">
            <i class="fa-solid fa-magnifying-glass"></i><span>Search Ride</span>
        </button>
    </div>
</section>

<section class="rides-section">
    <h2>Available Rides</h2>
    <div id="publishedRide"></div>
</section>
</main>
</div>

<div id="rideModal" class="ride-modal" style="display: none;">
    <div class="ride-modal-content">
        <button type="button" id="closeRideModal" class="ride-modal-close" aria-label="Close ride details">&times;</button>
        <h2><i class="fa-solid fa-car"></i> Ride Details</h2>
        <div id="rideModalDetails"></div>
        <button type="button" id="joinRideModalButton" class="btn primary">
            <i class="fa-solid fa-user-plus"></i> Join Ride
        </button>
    </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
